{{define "head"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.T "app_title"}}</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f6f8;color:#1b1f24}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:1.4rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 12px}
label{display:block;font-weight:600;margin:14px 0 4px}small{color:#5b6470;display:block;margin-top:4px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9ced6;border-radius:8px;font-size:1rem;background:#fff}
button{background:#2c6bed;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:1rem;margin-top:18px;width:100%;cursor:pointer}
.err{background:#fde8e8;color:#8a1c1c;padding:10px;border-radius:8px;margin:12px 0}.ok{background:#e6f6ea;color:#1b5e20;padding:10px;border-radius:8px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eef0f3}.row:last-child{border:0}.k{color:#5b6470}.v{font-weight:600;text-align:right;word-break:break-all}
nav{display:flex;gap:14px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e3e6ea;flex-wrap:wrap}nav a{color:#2c6bed;text-decoration:none}nav .sp{flex:1}nav .lang a{color:#5b6470;margin-left:8px}
.bar{height:10px;background:#e3e6ea;border-radius:5px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:#2c6bed}
code{background:#eef0f3;padding:2px 6px;border-radius:4px;word-break:break-all;font-size:.95rem}
.note{color:#5b6470;font-size:.9rem}
.qr{text-align:center;margin-top:12px}.qr img{width:220px;height:220px}
.good{color:#1b5e20}.bad{color:#8a1c1c}.warn{color:#8a5a00}
</style>
</head>
<body>{{end}}

{{define "langswitch"}}<span class="lang"><a href="/lang?l=zh-CN&amp;next={{.Path}}">中文</a><a href="/lang?l=en&amp;next={{.Path}}">English</a></span>{{end}}

{{define "nav"}}<nav>
<a href="/status">{{.T "status_heading"}}</a>
<a href="/settings">{{.T "settings"}}</a>
<span class="sp"></span>
{{template "langswitch" .}}
<a href="/logout">{{.T "logout"}}</a>
</nav>{{end}}

{{define "foot"}}</body>
</html>{{end}}
